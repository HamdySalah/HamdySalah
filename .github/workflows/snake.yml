name: Update contribution snake

# Regenerates assets/snake*.svg from the public contribution calendar and commits them if they changed.
# The README reads the committed files, so the profile still renders when Actions can't run.

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Regenerate snake SVGs
        run: python3 scripts/gen_snake.py "${{ github.repository_owner }}" assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg assets/snake-dark.svg
          git diff --cached --quiet || { git commit -m "chore: update contribution snake" && git push; }
